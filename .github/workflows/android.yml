name: LeviMusic Android Build

on:
  workflow_dispatch:
  push:
    branches: [main, 'integration/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LeviMusic
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Build and package
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.2.13676358"
          ./package.sh "$GITHUB_WORKSPACE/LeviMusic.levipack"

      - name: Upload .levipack
        uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-levipack
          path: LeviMusic.levipack
          if-no-files-found: error

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-ARM64
          path: build/liblevi_music.so
          if-no-files-found: error

      - name: Upload unstripped library (for crash symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: LeviMusic-ARM64-unstripped
          path: build/liblevi_music.so.unstripped
          if-no-files-found: error
